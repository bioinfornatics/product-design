# annotate-cycle — tracks installing (if needed) and processing browser
# annotations on a Product Design project, mirroring annotate-inject/annotate.
#
# This is a lightweight, usually-wisp workflow: annotation processing is
# operational/recurring, not a one-time deliverable worth permanent history
# (see bd mol pour vs wisp guidance) — prefer `bd mol wisp` unless the user
# wants an audit trail of every annotation round for this project.
#
# Usage:
#   bd mol wisp annotate-cycle --var target="settings screen" --var needs_install=false
#   bd mol wisp annotate-cycle --var target="..." --var needs_install=true --var framework=nextjs

formula = "annotate-cycle"
description = "Tracks installing (if needed) and processing a round of browser annotations on a Product Design project."
version = 1
type = "workflow"
phase = "vapor"

[vars.target]
description = "Project/prototype the annotations apply to"
required = true

[vars.needs_install]
description = "Whether the annotation mechanism still needs installing (true for an existing/user-provided project without it; false for any bundled-template prototype, which already has it)"
default = "false"
enum = ["true", "false"]

[vars.framework]
description = "Framework, only relevant when needs_install=true (drives which annotate-inject port to use)"
default = "nextjs"
enum = ["vite", "nextjs", "nuxt", "astro", "other"]

[[steps]]
id = "install"
title = "Install annotation mechanism on {{target}} ({{framework}})"
type = "task"
description = """Only relevant when needs_install={{needs_install}}. If false, close this step immediately with a note that the bundled template already includes it.
If true, run annotate-inject for framework {{framework}}:
- copy the matching assets, wire the endpoint at a non-underscore-prefixed path (goose-annotate, never __goose-annotate)
- mount the overlay client-side only, guarded to development
- verify by actually running dev (200 + file written) and a production build (503 or absent)"""
acceptance = "Either annotation was already present (closed with a note), or it was installed and both dev/prod runtime checks passed"

[[steps]]
id = "collect"
title = "Collect pending annotations for {{target}}"
needs = ["install"]
type = "human"
description = """Wait for the user to leave one or more annotations via the running overlay (drag a region, add a note, send). This step represents that waiting period — close it once the user confirms they've left feedback, or once annotate's proactive check finds a non-empty inbox."""
acceptance = "At least one record exists under <project-root>/.goose/annotations/inbox/, or the user confirms no annotations are pending this round"

[[steps]]
id = "process"
title = "Process pending annotations for {{target}}"
needs = ["collect"]
type = "task"
description = """Run annotate. For each pending record, oldest first:
- reproduce the same route/viewport, screenshot and crop to the bbox
- make the scoped edit the note asks for, preferring existing design-system component props over raw markup when one is in use
- re-capture and sanity-check, then move the record to processed/
Summarize what changed per annotation in plain language."""
acceptance = "Inbox is empty; every processed record has been summarized to the user"

[[steps]]
id = "verify"
title = "Re-run design QA after annotations for {{target}}"
needs = ["process"]
type = "task"
description = """If annotation edits were non-trivial (more than a tiny visual tweak) or this was the last outstanding round before handoff, re-open and re-run design-qa rather than assuming the annotation-scoped check was sufficient. Skip (close with a note) for trivial single-property tweaks already sanity-checked in the process step."""
acceptance = "Either design-qa was re-run and passed, or this step is closed with a justification for skipping it"
